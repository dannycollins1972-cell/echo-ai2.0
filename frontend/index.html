<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECHO AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }

        header h1 {
            margin: 0;
            color: #38bdf8;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 75%;
        }

        .user {
            background: #2563eb;
            margin-left: auto;
        }

        .echo {
            background: #1f2937;
            margin-right: auto;
        }

        form {
            display: flex;
            padding: 15px;
            background: #111827;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-left: 10px;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>ECHO AI</h1>
        <p>Your Personal AI Assistant</p>
    </header>

    <div id="chat">
        <div class="message echo">
            Hello! I'm ECHO. How can I help you today?
        </div>
    </div>

    <form id="chat-form">

        <input
            id="message"
            type="text"
            placeholder="Message ECHO..."
            autocomplete="off"
            required
        >

        <button type="submit">
            Send
        </button>

    </form>

</div>

<script>

const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            }
        );

        const data = await response.json();

        if (data.response) {

            addMessage(data.response, "echo");

        } else {

            addMessage(
                "ECHO encountered an error.",
                "echo"
            );

        }

    } catch (error) {

        addMessage(
            "Cannot connect to ECHO server.",
            "echo"
        );

    }

});

</script>

</body>
</html>
